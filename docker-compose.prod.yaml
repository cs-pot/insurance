services:
  app:
    environment:
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SENDER: ${MAIL_SENDER}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED}
