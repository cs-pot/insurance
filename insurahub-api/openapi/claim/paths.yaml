claims:
  get:
    tags:
      - Claims
    summary: View claims
    description: >
      Returns insurance claims with key information for claims management.
      Only available to administrators.
    operationId: getClaims
    x-spring-paginated: true
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Page size. Values above 100 are capped to 100 by the application.
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 20
      - name: sort
        in: query
        required: false
        description: >
          Optional sorting in Spring Pageable format: property or property,direction.
          Direction can be asc or desc. Allowed properties: createdAt, serviceDate,
          claimNumber, amount, status.
        schema:
          type: string
          default: createdAt,desc
    responses:
      '200':
        description: Claims retrieved successfully.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GetClaimsResponse'
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

  post:
    tags:
      - Claims
    summary: File a claim for an enrollment
    description: >
      Creates a new pending claim for a specific enrollment and attaches one receipt file.
      Only administrators can perform this operation. The receipt file must be a PDF,
      JPG, or PNG and must be smaller than 10 MiB. Send this as multipart/form-data
      with a JSON part named postClaimRequest and a file part named receiptFile.
    operationId: postClaim
    requestBody:
      required: true
      description: >
        Multipart form containing claim details as JSON and one receipt file.
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - postClaimRequest
              - receiptFile
            properties:
              postClaimRequest:
                $ref: './schemas.yaml#/PostClaimRequest'
              receiptFile:
                type: string
                format: binary
                description: Receipt file upload. Accepted formats are PDF, JPG, and PNG.
          encoding:
            postClaimRequest:
              contentType: application/json
            receiptFile:
              contentType: application/pdf, image/jpeg, image/png
    responses:
      '201':
        $ref: '../common/responses.yaml#/Created'
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '415':
        $ref: '../common/responses.yaml#/UnsupportedMediaType'
      '422':
        $ref: '../common/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

receiptByClaimId:
  get:
    tags:
      - Claims
    summary: Download a receipt
    description: Returns the receipt file by claim ID.
    operationId: getReceipt
    parameters:
      - name: claimId
        in: path
        required: true
        description: Claim ID.
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Receipt file returned successfully.
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'
