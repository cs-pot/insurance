PostClaimRequest:
  type: object
  description: |
    Claim details JSON part. In the OpenAPI UI, paste JSON like:
    {"enrollmentId":"43a2fb61-ea60-4096-960a-cc1d4a372d62","serviceDate":"2030-01-15","amount":125.50}
  example:
    enrollmentId: "43a2fb61-ea60-4096-960a-cc1d4a372d62"
    serviceDate: "2030-01-15"
    amount: 125.50
  required:
    - enrollmentId
    - serviceDate
    - amount
  properties:
    enrollmentId:
      type: string
      format: uuid
      description: Enrollment ID related to the claim.
      example: "43a2fb61-ea60-4096-960a-cc1d4a372d62"

    serviceDate:
      type: string
      format: date
      description: Date when the reimbursable service was provided.
      example: "2030-01-15"

    amount:
      type: number
      minimum: 0
      exclusiveMinimum: true
      multipleOf: 0.01
      description: Positive claim amount in EUR.
      example: 125.50

ClaimStatus:
  type: string
  description: Current status of a claim.
  enum:
    - PENDING
    - APPROVED
    - REJECTED
  example: PENDING

ClaimResponse:
  allOf:
    - $ref: '../common/schemas.yaml#/BaseListItemResponse'
    - type: object
      required:
        - consumerFullName
        - serviceDate
        - planName
        - amount
        - status
      properties:
        consumerFullName:
          type: string
          description: Full name of the consumer (employee) who submitted the claim.
          example: John Doe
        serviceDate:
          type: string
          format: date
          description: Date the service was provided.
          example: "2026-07-15"
        planName:
          type: string
          description: Name of the insurance plan the claim is filed against.
          example: Standard Health
        amount:
          type: number
          format: double
          description: Claimed amount in euros.
          example: 285.50
        status:
          $ref: '#/ClaimStatus'

GetClaimsResponse:
  type: object
  required:
    - content
    - page
  properties:
    content:
      type: array
      items:
        $ref: './schemas.yaml#/ClaimResponse'
    page:
      $ref: '../common/schemas.yaml#/PageResponse'
