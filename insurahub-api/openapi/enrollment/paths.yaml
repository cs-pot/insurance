enrollments:
  get:
    tags:
      - Enrollments
    summary: Get enrollments for the current consumer
    description: Returns a list of enrollments for the authenticated consumer, optionally filtered by status.
    operationId: getEnrollments
    x-spring-paginated: true
    parameters:
      - $ref: '../common/parameters.yaml#/Page'
      - $ref: '../common/parameters.yaml#/Size'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - ACTIVE
            - CANCELLED
            - EXPIRED
          default: ACTIVE
      - name: sort
        in: query
        required: false
        description: >
          Optional sorting in Spring Pageable format: property or property,direction.
          Direction can be asc or desc. Allowed properties: createdAt, status.
        schema:
          type: string
          default: createdAt,desc
    responses:
      '200':
        description: Successfully retrieved enrollments
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GetEnrollmentsResponse'
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'

planEnroll:
  post:
    tags:
      - Enrollments
    summary: Enroll on plan
    description: Enrolls the authenticated consumer on the plan. Only available to consumers.
    operationId: createEnrollment
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      201:
        $ref: '../common/responses.yaml#/Created'
      401:
        $ref: '../common/responses.yaml#/Unauthorized'
      403:
        $ref: '../common/responses.yaml#/Forbidden'
      422:
        $ref: '../common/responses.yaml#/UnprocessableEntity'
