packagePlans:
  get:
    tags:
      - Plans
    summary: Get package plans
    description: Retrieves plans attached to a package.
    operationId: getPackagePlans
    x-spring-paginated: true
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '../common/parameters.yaml#/Page'
      - $ref: '../common/parameters.yaml#/Size'
      - name: sort
        in: query
        required: false
        description: >
          Optional sorting in Spring Pageable format: property or property,direction.
          Direction can be asc or desc. Allowed properties: createdAt, name, type.
        schema:
          type: string
          default: createdAt,asc
    responses:
      '200':
        description: Package plans retrieved successfully.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GetPlansResponse'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

  post:
    tags:
      - Plans
    summary: Add a plan to a package
    description: Adds a new insurance plan to an existing package. Plans may be added after package initialization.
    operationId: addPackagePlan
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/PlanRequest'
          examples:
            validPlan:
              summary: Valid plan creation request
              value:
                name: Standard Health
                type: HEALTH_INSURANCE
                contribution: 250
                election: 500
    responses:
      '201':
        $ref: '../common/responses.yaml#/Created'
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '415':
        $ref: '../common/responses.yaml#/UnsupportedMediaType'
      '422':
        $ref: '../common/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

plans:
  get:
    tags:
      - Plans
    summary: Get available plans
    description: Returns a list of all plans belonging to initialized packages (i.e. plans available for enrollment).
    operationId: getPlans
    responses:
      '200':
        description: Successfully retrieved available plans
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/PlanResponse'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'

planById:
  get:
    tags:
      - Plans
    summary: Get plan details by ID
    description: Returns detailed information for a specific plan.
    operationId: getPlanById
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Successfully retrieved plan details
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/PlanResponse'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'

  put:
    tags:
      - Plans
    summary: Update a plan
    description: Updates a plan. Only available to administrators.
    operationId: putPlan
    parameters:
      - in: path
        name: id
        description: ID of the plan to update.
        schema:
          type: string
          format: uuid
        required: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/PlanRequest'
    responses:
      '204':
        description: Successful update
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '409':
        $ref: '../common/responses.yaml#/Conflict'
      '415':
        $ref: '../common/responses.yaml#/UnsupportedMediaType'
      '422':
        $ref: '../common/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

  delete:
    tags:
      - Plans
    summary: Remove a plan
    description: Removes a plan from its package. Removal is allowed only when the package has NOT_STARTED status.
    operationId: deletePlan
    parameters:
      - in: path
        name: id
        description: ID of the plan to remove.
        schema:
          type: string
          format: uuid
        required: true
    responses:
      '204':
        description: Plan removed successfully
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '422':
        $ref: '../common/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'
